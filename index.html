<!DOCTYPE html><html><head><meta charset=utf-8><title>UAR</title>
<style>
body{margin:0;background:#0b1020;overflow:hidden;font:13px system-ui,sans-serif;color:#fff;user-select:none}
canvas{display:block;width:100vw;height:100vh;cursor:crosshair}
#h{position:fixed;left:14px;top:10px;pointer-events:none}
#hp{font-size:34px;line-height:1;letter-spacing:2px;color:#ff4d6d}
#hp s{color:#fff5;text-decoration:none}
#xp{width:150px;height:12px;border-radius:6px;background:#0b1020aa;border:1px solid #fff8;margin:10px 0;overflow:hidden;position:relative;text-align:center;font-size:9px;font-weight:700;line-height:12px}
#xp i{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,#3fb8ff,#c45cff)}
#xp b{position:relative}
small{font-size:.6em}
#ups{position:fixed;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:10px;pointer-events:none}
.u{position:relative;width:32px;height:32px;border-radius:8px;border:2px solid var(--c);background:#0b1020aa;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--c)}
.u b{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:3px;background:var(--c);color:#0b1020;font-size:10px;border-radius:8px;padding:0 4px;white-space:nowrap}
#ib,#mb{position:fixed;right:16px;top:10px;width:40px;height:40px;border-radius:50%;border:2px solid #fffb;background:#0b1020aa;color:#fff;font:italic 700 20px serif}
#mb{right:64px;font-style:normal}
#in{position:fixed;right:16px;top:60px;width:min(400px,90vw);max-height:80vh;overflow:auto;background:#0b1020ee;padding:6px 16px 14px;border-radius:10px;line-height:1.5;display:none}
#in h4{margin:8px 0 2px;color:#9fd8ff}
#in td:first-child{color:#ffe94a;padding-right:8px;white-space:nowrap}
kbd{background:#fff2;border-radius:4px;padding:0 5px}
#m{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0b1020aa;text-align:center}
#m>div{background:#0e1228ee;padding:22px 26px;border-radius:14px}
#m h2{margin:0 0 16px;font-size:26px;color:#ffe94a}
#cs{display:flex;gap:14px}
.c{width:150px;padding:18px 14px;border-radius:12px;border:2px solid var(--c);background:#fff1;color:#fff;font:inherit;display:flex;flex-direction:column;align-items:center;gap:8px}
.c.s{outline:3px solid #fff;background:#fff3}
.c i{font-size:34px;line-height:1;color:var(--c);font-style:normal}
.c b{font-size:15px}
#m.show{display:flex}#in.show{display:block}
</style></head><body>
<canvas id=c></canvas>
<div id=h><div id=hp></div><div id=xp><i id=xf></i><b id=xt></b></div></div><div id=ups></div>
<button id=ib>i</button><button id=mb>♪</button>
<div id=in><h4>Keyboard &amp; mouse</h4><table>
<tr><td>Move</td><td><kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd></td></tr>
<tr><td>Jump</td><td><kbd>Space</kbd> <kbd>W</kbd> <kbd>↑</kbd> — hold for height</td></tr>
<tr><td>Rainbow</td><td><kbd>Click</kbd> to aim &amp; cast, or <kbd>X</kbd> / <kbd>Shift</kbd> forward (<kbd>↓</kbd> low)</td></tr>
<tr><td>Menu</td><td><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> or <kbd>←</kbd><kbd>→</kbd><kbd>Enter</kbd></td></tr>
<tr><td>Other</td><td><kbd>Esc</kbd> pause · <kbd>I</kbd> help · <kbd>M</kbd> mute · <kbd>R</kbd> restart</td></tr></table>
<h4>Gamepad</h4><table>
<tr><td>Sticks</td><td>Left move · right aim</td></tr>
<tr><td>LB / A · RB</td><td>Jump · cast</td></tr>
<tr><td>Menu</td><td>D-pad · A pick</td></tr>
<tr><td>Start</td><td>Pause</td></tr></table></div>
<div id=m><div><h2>Level up!</h2><div id=cs></div></div></div>
<script>
'use strict';
const {sin,cos,abs,min,max,hypot,floor,ceil,round,sign,random,sqrt,atan2,pow,exp,PI}=Math,TAU=PI*2;
const clamp=(v,a,b)=>max(a,min(b,v)),appr=(v,t,d)=>v<t?min(v+d,t):max(v-d,t);
const wrap=a=>atan2(sin(a),cos(a));
const $=id=>document.getElementById(id),on=(t,e,f)=>t.addEventListener(e,f);

// Tunables
const P={speed:260,gAcc:2600,aAcc:1400,fric:3000,drag:300,grav:1700,jump:540,cut:.45,fallMul:1.35,maxFall:950,coyote:.1,buf:.12,len:220,bulge:.32,grow:.5,fade:.35,cd:.12,maxR:3,stepUp:12,stepDown:20,spawn:2,spawnMin:2};

// Canvas
const cv=$('c'),X=cv.getContext('2d');let VW,VH,DPR;
const resize=()=>{DPR=devicePixelRatio;VW=innerWidth;VH=innerHeight;cv.width=VW*DPR;cv.height=VH*DPR};on(window,'resize',resize);resize();

// Input. inputMode: 0 keys, 1 mouse, 2 pad
const keys=new Set,pressed=new Set;let inputMode=0;
// keys are quoted: this object is indexed by string, so they must survive property mangling
const KEYMAP={'arrowleft':'l','a':'l','arrowright':'r','d':'r','arrowdown':'d','s':'d','arrowup':'j','w':'j',' ':'j','x':'f','shift':'f','m':'m','r':'R','i':'i','escape':'p'};
const over=()=>game.state>1.5&&(reset(),1);   // game over for >0.5s: any input restarts
on(window,'keydown',e=>{
  if(over())return;
  if(game.menu){const n=+e.key;if(n>=1&&n<=3)choose(n-1);else if(e.key=='ArrowLeft')menuMove(-1);else if(e.key=='ArrowRight')menuMove(1);else if(e.key=='Enter'||e.key==' ')choose(sel);e.preventDefault();return}
  const k=KEYMAP[e.key.toLowerCase()];if(!k)return;e.preventDefault();if(!keys.has(k))pressed.add(k);keys.add(k);if(k=='f')inputMode=0;unlock()});
on(window,'keyup',e=>keys.delete(KEYMAP[e.key.toLowerCase()]));
on(window,'blur',()=>keys.clear());
const mouse={x:0,y:0,over:0,fire:0};
on(cv,'pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.over=1;inputMode=1});
on(cv,'pointerdown',e=>{if(over())return;mouse.x=e.clientX;mouse.y=e.clientY;mouse.over=1;mouse.fire=1;inputMode=1;unlock()});
on(cv,'pointerleave',()=>mouse.over=0);
on(cv,'contextmenu',e=>e.preventDefault());
const pad={move:0,aim:null,prev:[]},PAD={4:'j',6:'j',0:'j',5:'f',7:'f',9:'S'};
function pollPad(){
  let gp=null;for(const g of navigator.getGamepads?.()||[])if(g&&g.connected){gp=g;break}
  if(!gp){pad.move=0;pad.aim=null;return}
  const dz=v=>abs(v)<.22?0:(v-sign(v)*.22)/.78;
  pad.move=dz(gp.axes[0]||0);const ax=dz(gp.axes[2]||0),ay=dz(gp.axes[3]||0);pad.aim=ax||ay?{x:ax,y:ay}:null;
  if(pad.move||pad.aim)inputMode=2;
  gp.buttons.forEach((bt,i)=>{const down=bt.pressed||bt.value>.5,was=pad.prev[i];pad.prev[i]=down;
    if(!down){if(was&&PAD[i])keys.delete(PAD[i]);return}if(was||over())return;unlock();
    if(game.menu){if(i==14)menuMove(-1);else if(i==15)menuMove(1);else if(i==0||i==5||i==7)choose(sel);return}
    const k=PAD[i];if(k){pressed.add(k);keys.add(k);inputMode=2}})}

// Audio: AudioWorklet synth from an inline Blob. Voice = [type(0 sine,1 tri,2 square,3 noise), f0, f1, dur, gain, attack, delay, noiseCut, curve]
const WORKLET=`class S extends AudioWorkletProcessor{constructor(){super();this.v=[];this.port.onmessage=e=>{for(const n of e.data)this.v.push({n,t:-(n[6]||0),p:0,l:0})}}
process(i,o){const b=o[0][0],V=this.v;for(let k=0;k<b.length;k++){let s=0;for(const v of V){const n=v.n;v.t+=1/sampleRate;if(v.t<0)continue;if(v.t>=n[3]){v.d=1;continue}const p=v.t/n[3];let w;
if(n[0]==3){const r=Math.random()*2-1;v.l+=(r-v.l)*(n[7]||.1);w=v.l*3}else{v.p+=n[1]*Math.pow(n[2]/n[1],p)/sampleRate;const x=v.p-Math.floor(v.p);w=n[0]==2?(x<.5?.5:-.5):n[0]==1?1-4*Math.abs(x-.5):Math.sin(x*6.2832)}
s+=w*Math.min(1,v.t/(n[5]||.005))*Math.pow(1-p,n[8]||2)*n[4]}b[k]=Math.tanh(s)}this.v=V.filter(v=>!v.d);return true}}registerProcessor('s',S)`;
let ac,node,muted=0;
function unlock(){if(ac){ac.state=='suspended'&&ac.resume();return}ac=new AudioContext;const g=ac.createGain();g.gain.value=.5;g.connect(ac.destination);
  ac.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET],{type:'application/javascript'}))).then(()=>{node=new AudioWorkletNode(ac,'s',{outputChannelCount:[1]});node.connect(g)})}
const play=v=>node&&!muted&&node.port.postMessage(v);
const arp=(n,ty,dur,g,gap,m=1)=>()=>play(n.map((f,i)=>[ty,f,f*m,dur,g,.01,i*gap]));
const S={
  jump:()=>play([[0,330,660,.16,.25],[1,660,990,.1,.08,0,.03]]),
  land:v=>{const g=clamp(.06+v/3000,.06,.3);play([[3,0,0,.09,g,0,0,.08],[0,150,70,.1,g*.8]])},
  rainbow:arp([440,554,659,880,1108,1318,1760],1,.22,.08,.035,1.01),
  pop:()=>play([[0,900,220,.18,.14]]),
  fall:()=>play([[2,400,80,.5,.1],[0,300,60,.5,.12]]),
  hurt:()=>play([[2,220,110,.25,.12],[3,0,0,.12,.15,0,0,.3]]),
  zap:c=>{const k=1+(c-1)*.07;play([[2,1200*k,150*k,.22,.12],[3,0,0,.15,.12,0,0,.5],[0,80,40,.2,.15]])},
  hit:()=>play([[2,500,250,.12,.1],[3,0,0,.08,.1,0,0,.4]]),
  bounce:()=>play([[0,260,180,.08,.06]]),
  pickup:arp([784,988,1175,1568],0,.3,.12,.06,1.02),
  choose:()=>play([[1,660,1320,.25,.12],[0,1320,1980,.3,.08,0,.1]]),
  warp:()=>play([[0,200,1600,.35,.12],[1,100,800,.35,.08,0,.05]]),
  spawn:()=>play([[0,120,480,1.2,.07,.3,0,0,1],[1,60,240,1.2,.05,.3,0,0,1]]),
  appear:()=>play([[2,300,900,.15,.1],[3,0,0,.15,.1,0,0,.2]]),
  dash:()=>play([[3,0,0,.25,.14,0,0,.6],[2,900,200,.2,.06]]),
  boss:()=>play([[2,70,55,1.6,.12,.1,0,0,1],[0,140,110,1.6,.1,.1,0,0,1],[3,0,0,1.4,.08,.4,0,.05]]),
  warn:()=>play([[0,1200,1200,.08,.08],[0,1200,1200,.08,.08,0,.14]]),
  thunder:()=>play([[3,0,0,.5,.3,0,0,.9],[3,0,0,.9,.18,.05,0,.04],[2,90,40,.5,.12]]),
  shield:()=>play([[0,500,480,.12,.1],[1,1000,900,.1,.05]]),
  levelup:arp([523,659,784,1046],1,.3,.1,.07),
  over:arp([392,370,349,262],2,.4,.08,.22,.98)};

// Level + game state
const W={w:3500,top:-500,bot:1150};
const clouds=[[40,720,520,80],[800,660,220,60],[1180,540,150,52],[1500,380,220,60],[1900,700,260,64],[2450,520,150,52],[2760,300,120,46],[2980,440,400,70]].map(([x,y,w,h])=>({x,y,w,h}));
// state: 0 play, 1 game over. up[]: levels per POOL index
const newGame=()=>({state:0,hp:3,maxHp:3,menu:0,pause:0,time:0,next:P.spawn,xp:0,need:3,level:0,wave:0,combo:0,comboT:0,bossPending:0,boss:null,bossN:0,swUsed:0,up:Array(16).fill(0)});
let game=newGame();
const up=i=>game.up[i];
// Upgrades: [name, icon, color, max level, badge kind (1 +20%/lv, 2 Lv n, 3 +2n), requires index]. 0 hp 1 warp 2 double 3 triple 4 lowgrav 5 magnet 6 second wind 7 sticky 8 reach 9 jump 10 thick 11 flat 12 fast
const POOL=[['+1 HP','♥','#ff4d6d',99],['Warp','↻','#5a5cff',1],['x2 Rainbow','◠◠','#c45cff',1],['x3 Rainbow','<small>◠◠◠</small>','#ff9a2e',1,0,2],['Low Grav','½g','#9fd8ff',1],['XP Magnet','⤴','#ffe94a',3,2],['Second Wind','♡','#ff9ac9',1],['More rainbows','+◠','#ffb347',3,3],['Longer Rainbow','⟷','#3fb8ff',5,1],['Higher Jump','⤒','#5ee66a',5,1],['Thicker Rainbow','≡','#ff3b5c',4,2],['Flatter Rainbow','(','#5ee6d0',5,2],['Quick Cast','⚡','#ffd34d',5,2],['Damage','✦','#fff7a0',2,4],['Cast Rate','↯','#9fd8ff',3,2],['Wider Aim','∠','#5ee6d0',3,5]];
const badge=(t,l)=>t==1?'+'+l*20+'%':t==2?'Lv '+l:t==4?'x'+(l+1):t==5?[90,120,180][l-1]+'°':'+'+l*2;
// reach shrinks with x2/x3 so the chained arcs don't cover too much
const jumpVel=()=>P.jump*sqrt(1+up(9)*.2),reach=()=>P.len*(1+up(8)*.2)*(up(3)?.6:up(2)?.75:1),gravity=()=>P.grav*(up(4)?.5:1),bulge=()=>max(.1,P.bulge-up(11)*.04),growTime=()=>max(.08,P.grow-up(12)*.08),bandW=()=>2.6*(1+up(10)*.35),maxR=()=>P.maxR+up(7)*2;
// Baddie types: e emoji, r radius, f font px, s speed range, c colour, at unlock time, w roll weight; behaviours drift/chase(radius)/dash/phase/split/boss/eats/storm
const T=[
  {e:'😈',r:15,f:30,s:128,hp:1,xp:1,c:'#4cff88',drift:1,at:0,w:3},
  {e:'👿',r:15,f:30,s:70,hp:1,xp:1,c:'#ff4d6d',chase:900,at:60,w:2},
  {e:'👽',r:18,f:34,s:48,hp:2,xp:2,c:'#5ee66a',chase:1500,at:120,w:1.5},
  {e:'👾',r:17,f:32,s:93,hp:1,xp:0,c:'#b06cff',drift:1,at:150,w:1.5,split:1},
  {e:'😈',r:9,f:18,s:200,hp:1,xp:1,c:'#4cff88',drift:1},
  {e:'🦇',r:14,f:30,s:120,hp:1,xp:2,c:'#ffb347',dash:1,at:180,w:1.5},
  {e:'👻',r:15,f:30,s:68,hp:1,xp:2,c:'#e0f0ff',chase:1400,at:240,w:1,phase:1},
  {e:'👹',r:26,f:50,s:38,hp:4,xp:4,c:'#ff6b3b',chase:2000,at:300,w:.7},
  {n:'RAINBOW EATER',e:'🐉',r:34,f:64,s:55,hp:10,xp:10,c:'#ff3b5c',chase:1e9,boss:1,eats:1},
  {n:'STORM CLOUD',e:'⛈️',r:38,f:70,s:128,hp:10,xp:10,c:'#5a5cff',boss:1,storm:1,phase:1}];
const baddies=[],spawns=[],pups=[],bolts=[],parts=[],rbs=[],RC=['#ff3b5c','#ff9a2e','#ffe94a','#5ee66a','#3fb8ff','#5a5cff','#c45cff'];

// Rainbows (circular arcs). st: 0 growing, 1 live, 2 fading
function arcGeom(x0,y0,x1,y1,facing){const dx=x1-x0,dy=y1-y0,L=hypot(dx,dy),h=max(12,L*bulge());let nx=-dy/L,ny=dx/L;
  if(abs(ny)<1e-4){nx=facing>0?1:-1;ny=0}else if(ny>0){nx=-nx;ny=-ny}
  const r=(L*L/4+h*h)/(2*h),cx=(x0+x1)/2-nx*(r-h),cy=(y0+y1)/2-ny*(r-h),a0=atan2(y0-cy,x0-cx);
  return{cx,cy,r,a0,sweep:wrap(atan2(y1-cy,x1-cx)-a0)}}
const mkRb=(x0,y0,x1,y1,facing,gen=0)=>Object.assign(arcGeom(x0,y0,x1,y1,facing),{prog:0,st:0,alpha:1,t:0,x1,y1,dx:x1-x0,dy:y1-y0,facing,gen,band:bandW(),grow:growTime()});
const liveRbs=()=>rbs.filter(r=>r.st<2);
function addRb(r){rbs.push(r);let l=liveRbs();while(l.length>maxR()){l[0].st=2;S.pop();l=liveRbs()}}
const onArc=(a,ang)=>{const d=wrap(ang-a.a0),s=a.sweep*a.prog;return s>=0?d>=-.01&&d<=s+.01:d<=.01&&d>=s-.01};
function surf(p,x){if(p.r==null)return x>=p.x&&x<=p.x+p.w?p.y:null;const dx=x-p.cx;if(abs(dx)>p.r)return null;const y=p.cy-sqrt(p.r*p.r-dx*dx);return onArc(p,atan2(y-p.cy,dx))?y:null}
function highest(x,y0,y1){let best=null;const chk=p=>{for(const o of[-11,0,11]){const y=surf(p,x+o);if(y!=null&&y>=y0&&y<=y1&&(!best||y<best.y))best={y,p}}};clouds.forEach(chk);for(const r of rbs)if(r.st<2){chk(r);if(r.pad)chk(r.pad)}return best}
function updRbs(dt){for(let i=rbs.length-1;i>=0;i--){const r=rbs[i];r.t+=dt;
  if(!r.st){r.prog=min(1,r.t/r.grow);if(r.prog>=1){r.st=1;sparkle(r.x1,r.y1);if(r.gen==0&&up(2)||r.gen==1&&up(3)){addRb(mkRb(r.x1,r.y1,r.x1+r.dx,r.y1+r.dy,r.facing,r.gen+1));S.rainbow()}}}
  else if(r.st==2){r.alpha-=dt/P.fade;if(r.alpha<=0)rbs.splice(i,1)}}}

// Particles
function burst(x,y,n,o){for(let i=0;i<n;i++){if(parts.length>400)parts.shift();const a=random()*TAU,sp=(o.sp||80)*(.3+random());
  parts.push({x,y,vx:cos(a)*sp,vy:sin(a)*sp*(o.ys??1)+(o.vy||0),life:0,max:(o.life||.5)*(.6+random()*.6),size:(o.size||3)*(.6+random()*.8),col:o.cols?o.cols[i%7]:o.col||'#fff',g:o.g||0,star:o.star,rot:random()*TAU,spin:(random()-.5)*8})}}
const sparkle=(x,y)=>burst(x,y,12,{sp:150,life:.6,size:6,cols:RC,star:1,g:120});
function updParts(dt){for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.life+=dt;if(q.life>=q.max){parts.splice(i,1);continue}q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=1-2*dt;q.vy*=1-2*dt}}

// Baddies. mode: dasher 0 hover 1 windup 2 dash; storm 0 storming 2 recharging (vulnerable)
const reflect=(b,nx,ny)=>{const d=b.vx*nx+b.vy*ny;if(d<0){b.vx-=2*d*nx;b.vy-=2*d*ny}};
function bounceFx(b){b.stun=.7;if(b.bcd>0)return;b.bcd=.15;if(abs(b.x-player.x)<700)S.bounce();burst(b.x,b.y,4,{sp:60,life:.3,size:2,col:'#fffc'})}
function hitB(b,nx,ny){const c=T[b.type];if(c.storm&&b.mode!=2){b.hcd=.4;b.flash=.25;S.shield();return}b.hp-=1+up(13);b.hcd=.6;b.flash=.3;
  if(b.hp<=0)return killB(b);if(!c.boss){b.vx=nx*220;b.vy=ny*220;b.stun=.9}S.hit();burst(b.x,b.y,10,{sp:120,life:.4,size:3})}
const orb=(x,y,heart)=>pups.push({x:x+(random()-.5)*40,y:y+(random()-.5)*30,t:random()*3,r:heart?14:12,heart});
function killB(b){const c=T[b.type],g=game;b.alive=0;b.die=.5;g.combo=g.comboT>0?g.combo+1:1;g.comboT=2;
  const bonus=g.combo>=8?3:g.combo>=5?2:g.combo>=3?1:0;S.zap(min(g.combo,10));burst(b.x,b.y,22,{sp:180,life:.7,size:3.5,cols:RC,g:250});
  for(let i=c.xp*(b.elite?3:1)+(c.xp?bonus:0);i>0;i--)orb(b.x,b.y);
  if(c.split)for(let i=0;i<2;i++){const m=spawnB(4,b.x+(i?18:-18),b.y,1);m.vx=(i?1:-1)*m.sp*.8;m.vy=-m.sp*.6;m.hcd=.7}
  if(c.boss){g.boss=null;orb(b.x,b.y,1);shake=14;S.levelup();burst(b.x,b.y,60,{sp:300,life:1.2,size:4,cols:RC,g:200})}}
function loseHp(){const g=game,p=player;g.hp--;if(g.hp>0)return 1;
  if(up(6)&&!g.swUsed){g.swUsed=1;g.hp=1;p.inv=2.5;p.dead=0;flash=.6;flashC='255,233,74';shake=12;S.levelup();burst(p.x,p.y-24,50,{sp:320,life:1,size:4,cols:RC});
    for(const b of baddies){const dx=b.x-p.x,dy=b.y-p.y,d=hypot(dx,dy)||1;if(d<420){b.stun=2;b.vx=dx/d*360;b.vy=dy/d*360}}return 1}
  gameOver()}
function hurt(dir){const p=player;p.inv=1.5;p.vx=dir*320;p.vy=-320;p.gnd=0;p.sq=.25;flash=.35;flashC='255,80,100';shake=10;S.hurt();burst(p.x,p.y-24,12,{sp:150,life:.5,size:3,col:'#ff4d6d'});loseHp()}

  if(b.elite){X.strokeStyle='#ffd34d';X.setLineDash([8,6]);X.lineDashOffset=-b.bob*40;X.beginPath();X.arc(0,0,b.r+5,0,TAU);X.stroke();X.setLineDash([])}
  if(c.storm&&b.alive&&b.mode!=2){X.strokeStyle=`rgba(160,190,255,${.35+.15*sin(b.bob*6)})`;X.beginPath();X.arc(0,0,b.r+8,0,TAU);X.stroke()}
  if(b.flash>0)circ(0,0,b.r+6,`rgba(255,255,255,${b.flash*2.5})`);
  txt(c.e,0,2,c.f+F,'#fff');
  if(b.alive&&b.maxHp>1&&!c.boss){const n=b.maxHp,w=min(10,floor(120/n)-2),st=w+2;for(let i=0;i<n;i++)rrect(-n*st/2+i*st+1,-b.r-12,w,4,2,i<b.hp?b.elite?'#ffd34d':c.c:'#0006')}
  X.restore()}
function drawBolt(L){const y1=W.bot+100;X.save();X.lineCap='round';
  if(L.t<.7){X.globalAlpha=.35+.35*sin(L.t*30);X.strokeStyle='#fff';X.lineWidth=2;X.setLineDash([10,8]);X.beginPath();X.moveTo(L.x,L.y0);X.lineTo(L.x,y1);X.stroke()}
  else{X.globalAlpha=1-(L.t-.7)/.3;X.beginPath();X.moveTo(L.x,L.y0);for(let y=L.y0+30;y<y1;y+=30)X.lineTo(L.x+(random()-.5)*24,y);X.lineTo(L.x,y1);X.strokeStyle='#7fb8ff';X.lineWidth=9;X.stroke();X.strokeStyle='#fff';X.lineWidth=3;X.stroke()}
  X.restore()}
function drawSpawn(s){const k=s.t/(s.dur||1.4),col=s.elite?'#ffd34d':T[s.type].c,R=30*(s.scale||1)*sin(k*PI/2+.2);X.save();X.translate(s.x,s.y);X.globalAlpha=.5+.5*k;X.lineWidth=3;X.lineCap='round';
  for(let i=0;i<4;i++){const a=time*(5+4*k)*(i%2?-1:1)+i*TAU/4;X.beginPath();X.arc(0,0,R*(.55+.45*((i+k*3)%1)),a,a+1.2+k);X.strokeStyle=i%2?col:'#fff';X.stroke()}
  X.globalAlpha=k*k;circ(0,0,6+8*k,col);X.restore()}
function star(x,y,r,t){X.save();X.translate(x,y);X.rotate(t);X.beginPath();for(let i=0;i<10;i++){const a=i*PI/5-PI/2,q=i%2?r*.45:r;X.lineTo(cos(a)*q,sin(a)*q)}X.closePath();X.fill();X.restore()}
function drawPup(u){X.save();X.translate(u.x,u.y);const pl=1+sin(u.t*6)*.1;
  if(u.heart)txt('♥',0,2,30*pl+F,'#ff4d6d');else{X.lineWidth=1.7;X.globalAlpha=.85;for(let i=0;i<7;i++){X.beginPath();X.arc(0,0,(16-i*1.5)*pl,0,TAU);X.strokeStyle=RC[i];X.stroke()}X.globalAlpha=1;X.fillStyle='#fff';star(0,0,7*pl,u.t*2)}X.restore()}
function drawBoss(){const b=game.boss;if(!b||!b.alive)return;const c=T[b.type],w=min(360,VW-80),x=(VW-w)/2,y=96;
  txt(c.n,VW/2,y-12,'bold 15'+F,'#fff');rrect(x,y,w,12,6,'#0007');if(b.hp>0)rrect(x+2,y+2,(w-4)*b.hp/b.maxHp,8,4,c.storm&&b.mode!=2?'#9fb4ff':c.c);
  if(c.storm)txt(b.mode==2?'HIT IT!':`shielded · ${ceil(b.timer)}s`,VW/2,y+22,'12'+F,'#fffd')}
function drawCombo(){const g=game;if(g.combo<2||g.comboT<=0)return;const p=player,k=min(1,g.comboT/.5),s='×'+g.combo,x=p.x-cam.x,y=p.y-78-cam.y-(1-k)*10;X.save();X.globalAlpha=k;
  X.font='bold '+(18+min(g.combo,10)*1.5)+F;X.textAlign='center';X.textBaseline='middle';X.lineWidth=4;X.strokeStyle='#0009';X.strokeText(s,x,y);X.fillStyle=RC[g.combo%7];X.fillText(s,x,y);X.restore()}
function drawOverlay(){const g=game;if(g.pause&&!g.state){X.fillStyle='#0b101e73';X.fillRect(0,0,VW,VH);txt('PAUSED',VW/2,VH/2-20,'bold 44'+F,'#fff');txt('Esc / Start to resume',VW/2,VH/2+24,'16'+F,'#fffd');return}
  if(!g.state)return;X.fillStyle='#0b101e80';X.fillRect(0,0,VW,VH);txt('GAME OVER',VW/2,VH/2-40,'bold 48'+F,'#ff4d6d');
  txt('Level '+g.level,VW/2,VH/2+8,'22'+F,'#fff')}
function render(){X.setTransform(DPR,0,0,DPR,0,0);const sky=X.createLinearGradient(0,0,0,VH);sky.addColorStop(0,'#0b0a1a');sky.addColorStop(.22,'#1f4fa8');sky.addColorStop(.75,'#4fb0ff');sky.addColorStop(1,'#f2d27a');X.fillStyle=sky;X.fillRect(0,0,VW,VH);
  if(tint>0){X.fillStyle=`rgba(40,10,70,${tint*.35})`;X.fillRect(0,0,VW,VH)}
  X.save();X.translate(-cam.x+(random()-.5)*shake,-cam.y+(random()-.5)*shake);
  const l=liveRbs(),old=l.length>=maxR()?l[0]:null;for(const r of rbs)drawRb(r,r==old);drawAim();bolts.forEach(drawBolt);spawns.forEach(drawSpawn);baddies.forEach(drawB);pups.forEach(drawPup);
  for(const q of parts){X.globalAlpha=1-q.life/q.max;if(q.star){X.fillStyle=q.col;star(q.x,q.y,q.size,q.rot+q.life*q.spin)}else circ(q.x,q.y,q.size,q.col)}X.globalAlpha=1;drawUni(player);clouds.forEach(drawCloud);for(const r of rbs)if(r.pad){X.globalAlpha=r.alpha;drawCloud(r.pad)}X.globalAlpha=1;X.restore();
  drawCombo();if(flash>0){X.fillStyle=`rgba(${flashC},${flash})`;X.fillRect(0,0,VW,VH)}drawBoss();drawOverlay()}

// HUD + main loop
const hpEl=$('hp'),xfEl=$('xf'),xtEl=$('xt'),upsEl=$('ups'),inEl=$('in');let hudKey;
on($('ib'),'click',()=>{inEl.classList.toggle('show');unlock()});
const mbEl=$('mb'),toggleMute=()=>{muted=!muted;mbEl.style.opacity=muted?.4:1};on(mbEl,'click',toggleMute);
function hud(){const g=game,k=[g.hp,g.maxHp,g.xp,g.need,g.swUsed,...g.up].join();
  if(k!=hudKey){hudKey=k;hpEl.innerHTML='♥'.repeat(g.hp)+'<s>'+'♥'.repeat(g.maxHp-g.hp)+'</s>';xfEl.style.width=g.xp/g.need*100+'%';xtEl.textContent=`XP ${g.xp} / ${g.need}`;
    upsEl.innerHTML=POOL.map((u,i)=>i&&g.up[i]&&!(i==6&&g.swUsed)?`<div class=u style="--c:${u[2]}">${u[1]}${u[4]?`<b>${badge(u[4],g.up[i])}</b>`:''}</div>`:'').join('')}}
let last=performance.now(),acc=0;const STEP=1/120;
function frame(now){const dt=min(.1,(now-last)/1000);last=now;time+=dt;pollPad();
  if(pressed.has('m'))toggleMute();if(pressed.has('i'))inEl.classList.toggle('show');
  if(game.state)game.state+=dt;if(pressed.has('R'))reset();else if(pressed.has('p')||pressed.has('S'))togglePause();
  if(!game.pause){if(mouse.fire){inputMode=1;fire()}else if(pressed.has('f'))fire()}mouse.fire=0;
  if(!game.menu&&!game.pause){acc+=dt;while(acc>=STEP){updPlayer(STEP);updSpawner(STEP);updBaddies(STEP);updPups(STEP);updRbs(STEP);updParts(STEP);updCam(STEP);acc-=STEP;if(game.menu)break}}
  pressed.clear();lockT=max(0,lockT-dt);csEl.style.opacity=1-lockT*.6;flash=max(0,flash-dt*2.5);shake=max(0,shake-dt*30);tint=appr(tint,game.boss&&game.boss.alive||spawns.some(s=>s.scale)?1:0,dt*1.5);render();hud();requestAnimationFrame(frame)}
reset();flash=0;requestAnimationFrame(frame);
</script></body></html>
